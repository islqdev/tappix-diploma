><text x="78" y="492" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#64736D">Payment status</text><rect x="78" y="506" width="678" height="46" rx="10" fill="#F8FAF8" stroke="#E1E8E2"/><text x="94" y="535" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#172D29">Not recorded</text><text x="78" y="611" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#64736D">The assigned plan is not proof of payment.</text><rect x="78" y="651" width="285" height="48" rx="12" fill="#126C58" stroke="none"/><text x="96" y="681" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white">Activate seven-day trial</text><text x="78" y="744" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#64736D">Activation and later changes are written to the audit log.</text><rect x="810" y="215" width="420" height="565" rx="20" fill="white" stroke="#E1E8E2"/><text x="838" y="255" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172D29">Effective limits</text><text x="838" y="283" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#64736D">Illustrative pilot configuration</text><text x="838" y="341" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#172D29">Guests</text><text x="1100" y="341" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#126C58">1,000</text><path d="M838 365H1200" stroke="#E1E8E2"/><text x="838" y="414" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#172D29">Branches</text><text x="1100" y="414" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#126C58">1</text><path d="M838 438H1200" stroke="#E1E8E2"/><text x="838" y="487" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#172D29">Staff accounts</text><text x="1100" y="487" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#126C58">3</text><path d="M838 511H1200" stroke="#E1E8E2"/><text x="838" y="560" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#172D29">QR / NFC points</text><text x="1100" y="560" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#126C58">2</text><path d="M838 584H1200" stroke="#E1E8E2"/><text x="838" y="662" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172D29">Expiry policy requires agreement</text><text x="838" y="691" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#64736D">The server must enforce the chosen</text><text x="838" y="714" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#64736D">policy; it must not silently delete data.</text></svg>